title: Convert Multiple Data Files
name: jtBatchConvert
jus: '3.0'
stage: 0
compilerMode: tame
events:
   loaded: './jtbatchconvert::view_loaded'

children:
  - type: LayoutBox
    style: inline
    stretchFactor: 1
    margin: large
    children:
      - type: TextBox
        name: fleInp
        format: string
        stretchFactor: 6
        margin: large
      - type: CustomControl
        name: fleChs
        stretchFactor: 1
        horizontalAlignment: right
        verticalAlignment: center

  - type: LayoutBox
    style: inline
    stretchFactor: 1
    margin: large
    children:
      - type: LayoutBox
        style: list
        stretchFactor: 1
        margin: large
        horizontalAlignment: left
        children:
          - type: CheckBox
            name: shwHlp
      - type: LayoutBox
        style: list
        stretchFactor: 1
        margin: none
        horizontalAlignment: right
        children:
          - type: ActionButton
            name: btnCnv
