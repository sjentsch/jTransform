---
name:  jtDistances
title: Calculate Distances
menuGroup: Data
menuSubgroup: jTransform
version: '1.0.0'
jas: '1.2'

completeWhenFilled: true

options:
  - name: data
    type: Data
#    description:
#      R: the data as a data frame

  - name: varDst
    title: Variables To Calculate Distances For
    type: Variables
    permitted:
    - numeric
    - factor
    required: true
    default:
#    description:
#      R: >
#      a vector of strings containing the names of the variables for
#      which distances are to be calculated

  - name: dstCoR
    type: List
    options:
      - title: Columns
        name:  columns
      - title: Rows
        name:  rows
    default: columns
    
  - name: dstStd
    type: List
    options:
      - title: Do Not Standardize
        name:  none
      - title: z-Standardization
        name:  z
      - title: Divide by the Standard Deviation
        name:  sd
      - title: Divide by the Range
        name:  range
      - title: Divide by the Absolute Maximum
        name:  max
      - title: Divide by the Mean
        name:  mean
      - title: Rescale (Subtract the Mean and Divide by the Range)
        name:  rescale
    default: none

  - name: dstCtg
    type: List
    options:
      - title: Continuous Variables
        name:  ctgCnt
      - title: Frequency Counts
        name:  ctgFrq
      - title: Binary Vars. - Matching Coefficients
        name:  ctgBnM
      - title: Binary Vars. - Conditional Probabilities
        name:  ctgBnC
      - title: Binary Vars. - Predictability Measures
        name:  ctgBnP
      - title: Binary Vars. - Other Measures
        name:  ctgBnO
      - title: Do Not Calculate Distances
        name:  ctgNot
    default: ctgCnt

  - name: dstCnt
    type: List
    options:
      - title: Euclidean Distance
        name:  euclid
      - title: Squared Euclidean Distance
        name:  seuclid
      - title: City Block / Manhattan Distance
        name:  block
      - title: Cosine Between Vectors (Similarity)
        name:  cosine
      - title: Correlation (Similarity)
        name:  correlation
      - title: Chebychev / Maximum Distance
        name:  chebychev
      - title: Minkowski Distance With Power
        name:  minkowski
      - title: Minkowski Distance With Power and Root
        name:  power
      - title: Canberra Distance
        name:  canberra
    default: euclid

  - name: pwrCnt
    type: Integer
    title: Power
    default: 2

  - name: rt_Cnt
    type: Integer
    title: Root
    default: 2

  - name: dstFrq
    type: List
    options:
      - title: Chi-Square Dissimilarity
        name:  chisq
      - title: Normalized Chi-Square Dissimilarity
        name:  ph2
    default: chisq

  - name: dstBnM
    type: List
    options:
      - title: Jaccard Similarity
        name:  jaccards
      - title: Jaccard Dissimilarity
        name:  jaccardd
      - title: Simple Matching
        name:  sm
      - title: Dice / Czekanowski / Sørenson Sim.
        name:  dice
      - title: Russell and Rao
        name:  rr
      - title: Rogers and Tanimoto
        name:  rt
      - title: Sokal and Sneath Measure 1
        name:  ss1
      - title: Sokal and Sneath Measure 2
        name:  ss2
      - title: Sokal and Sneath Measure 3
        name:  ss3
      - title: Kulczynski Measure 1
        name:  k1
    default: jaccards

  - name: p__BnM
    type: String
    title: Present
    default: "1"

  - name: np_BnM
    type: String
    title: Not Present
    default: "0"

  - name: dstBnC
    type: List
    options:
      - title: Kulczynski Measure 2
        name:  k2
      - title: Hamann
        name:  hamann
      - title: Sokal and Sneath Measure 4
        name:  ss4
    default: k2

  - name: p__BnC
    type: String
    title: Present
    default: "1"

  - name: np_BnC
    type: String
    title: Not Present
    default: "0"

  - name: dstBnP
    type: List
    options:
      - title: Yule’s Q
        name:  q
      - title: Goodman and Kruskal Lambda
        name:  lambda
      - title: Yule’s Y
        name:  y
      - title: Anderberg’s D
        name:  d
    default: q

  - name: p__BnP
    type: String
    title: Present
    default: "1"

  - name: np_BnP
    type: String
    title: Not Present
    default: "0"

  - name: dstBnO
    type: List
    options:
      - title: Binary Squared Euclidean Distance
        name:  bseuclid
      - title: Binary Euclidean Distance
        name:  beuclid
      - title: Fourfold Point Correlation
        name:  phi
      - title: Ochiai
        name:  ochiai
      - title: Pattern Difference
        name:  pattern
      - title: Binary Shape Difference
        name:  bshape
      - title: Dispersion Similarity
        name:  disper
      - title: Size Difference
        name:  size
      - title: Lance and Williams Non-Metric Dissim.
        name:  blwmn
      - title: Variance Dissimilarity
        name:  variance
      - title: Sokal and Sneath Measure 5
        name:  ss5
    default: bseuclid

  - name: p__BnO
    type: String
    title: Present
    default: "1"

  - name: np_BnO
    type: String
    title: Not Present
    default: "0"

  - name: shwHlp
    type: Bool
    title: Help / Information
    default: false

  - name: btnCrt
    type: Action
    title: Create
    action: open

  - name: jxfLog
    type: Bool
    title: Create Log File
    hidden: true    
    default: false

...
